<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Horizon DarkRP</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070912; }
body { font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; color: #F7F1E6; -webkit-user-select: none; user-select: none; }
#scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

/* twinkling stars + flickering windows (old WebKit friendly) */
@-webkit-keyframes tw { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.25; } }
@keyframes tw { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.25; } }
.tw1 { -webkit-animation: tw 3.1s ease-in-out infinite; animation: tw 3.1s ease-in-out infinite; }
.tw2 { -webkit-animation: tw 4.3s ease-in-out infinite 1.2s; animation: tw 4.3s ease-in-out infinite 1.2s; }
.tw3 { -webkit-animation: tw 5.7s ease-in-out infinite 2.4s; animation: tw 5.7s ease-in-out infinite 2.4s; }
@-webkit-keyframes fl { 0%, 92%, 100% { opacity: 0.75; } 94% { opacity: 0.1; } 96% { opacity: 0.75; } 97% { opacity: 0.15; } }
@keyframes fl { 0%, 92%, 100% { opacity: 0.75; } 94% { opacity: 0.1; } 96% { opacity: 0.75; } 97% { opacity: 0.15; } }
.fl { -webkit-animation: fl 7s linear infinite; animation: fl 7s linear infinite; }
@-webkit-keyframes sh { 0%, 100% { -webkit-transform: translateX(0); } 50% { -webkit-transform: translateX(14px); } }
@keyframes sh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
.sh { -webkit-animation: sh 6s ease-in-out infinite; animation: sh 6s ease-in-out infinite; }

/* the wordmark sits just under the horizon line on any screen shape */
#word { position: absolute; left: 0; right: 0; top: 61vh; text-align: center; font-family: 'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif; font-weight: 900; font-size: 14vh; line-height: 0.9; letter-spacing: 0.07em; padding-left: 0.07em; color: #F7F1E6; }

/* top corners */
#info { position: absolute; left: 40px; top: 32px; }
#info .name { font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.06em; }
#info .meta { margin-top: 4px; font-size: 17px; font-weight: 600; letter-spacing: 0.08em; color: #B8B0C8; text-transform: uppercase; }
#info .meta b { color: #E8743B; font-weight: 700; }
#tip { position: absolute; right: 40px; top: 32px; width: 420px; text-align: right; }
#tip .label { font-size: 15px; font-weight: 700; letter-spacing: 0.22em; color: #E8743B; }
#tip .text { margin-top: 6px; font-size: 21px; font-weight: 500; line-height: 1.25; color: #F7F1E6; -webkit-transition: opacity 0.6s; transition: opacity 0.6s; }

/* the loading panel */
#panel { position: absolute; left: 50%; bottom: 44px; width: 680px; margin-left: -340px; }
#row { overflow: hidden; }
#status { float: left; font-size: 16px; font-weight: 700; letter-spacing: 0.22em; color: #E8743B; text-transform: uppercase; }
#count { float: right; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; color: #B8B0C8; }
#file { margin-top: 6px; font-size: 25px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar { position: relative; margin-top: 14px; height: 4px; background: rgba(247, 241, 230, 0.16); }
#fill { position: absolute; left: 0; top: 0; height: 4px; width: 0; background: #E8743B; -webkit-transition: width 0.35s ease-out; transition: width 0.35s ease-out; }
#marker { position: absolute; top: -11px; width: 26px; height: 26px; margin-left: -13px; left: 0; -webkit-transition: left 0.35s ease-out; transition: left 0.35s ease-out; }
#pct { position: absolute; right: 0; top: 14px; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #B8B0C8; }
#recent { margin-top: 22px; height: 66px; overflow: hidden; }
#recent div { font-size: 16px; font-weight: 500; color: #8F87A3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 22px; }
#recent div:first-child { color: #B8B0C8; }
</style>
</head>

<div id="info">
  <div class="name" id="server">HORIZON DARKRP</div>
  <div class="meta"><span id="map">-</span> &nbsp;·&nbsp; <span id="mode">DarkRP</span> &nbsp;·&nbsp; <b id="slots">-</b> slots</div>
</div>

  <div class="label">TIP</div>
  <div class="text" id="tiptext"></div>

<div id="panel">
  <div id="row"><div id="status">Joining server</div><div id="count"></div></div>
  <div id="file">Connecting...</div>
  <div id="bar">
    <div id="fill"></div>
    <svg id="marker" viewBox="0 0 26 26" aria-hidden="true"><polygon points="13,1 16.2,9.4 25,10.1 18.3,15.9 20.4,24.5 13,19.9 5.6,24.5 7.7,15.9 1,10.1 9.8,9.4" fill="#FFCB5C" stroke="#0A0C17" stroke-width="2" stroke-linejoin="round"/></svg>
    <div id="pct">0%</div>
  </div>
  <div id="recent"></div>
</div>

<script>
// ---------------------------------------------------------------- edit these
var TIPS = [
  "Airdrops come down every 45 minutes. Stay in the circle the longest to win the loot.",
  "Printer money comes out dirty. Wash it in a Money Washer, then dry it on a rack.",
  "Spin the Daily Wheel once every 24 hours for free prizes.",
  "Socket gems into your guns from your inventory to make them stronger.",
  "Join a clan to raise flags, share upgrades and fight together.",
  "Safe zones protect you - unless you're combat blocked.",
  "Type !airdrop to see when the next airdrop is."
];
var TIP_SECONDS = 7;

// ---------------------------------------------------------------- state
var total = 0, needed = 0, current = "", recent = [];
var gotGmod = false;
var wsDone = 0, wsTotal = 0;          // workshop progress, read from the status text when GMod sends it

function el(id) { return document.getElementById(id); }
function setText(id, t) { var e = el(id); if (e) { e.textContent = t; } }

function render() {
  var frac = 0;
  var countText = "";
  if (wsTotal > 0 && (total <= 0 || needed <= 0)) {
    frac = wsDone / wsTotal;
    countText = wsDone + " / " + wsTotal + " addons";
  } else if (total > 0) {
    frac = (total - needed) / total;
    countText = (total - needed) + " / " + total + " files";
  }
  frac = Math.max(0, Math.min(1, frac));
  el("fill").style.width = (frac * 100) + "%";
  el("marker").style.left = (frac * 100) + "%";
  setText("pct", Math.floor(frac * 100) + "%");
  setText("count", countText);
  setText("file", current || "Please wait...");
  var html = "";
  for (var i = 0; i < recent.length && i < 3; i++) {
    html += "<div>" + recent[i].replace(/</g, "&lt;") + "</div>";
  }
  el("recent").innerHTML = html;
}

function pushRecent(name) {
  if (!name || recent[0] === name) { return; }
  recent.unshift(name);
  if (recent.length > 3) { recent.length = 3; }
}

// "Downloading 'Some Addon' (3 of 48)" / "3/48" style text -> workshop progress
function readProgress(text) {
  var m = /(\d+)\s*(?:of|\/)\s*(\d+)/i.exec(text);
  if (m) { wsDone = parseInt(m[1], 10); wsTotal = parseInt(m[2], 10); }
}

// pull a nicer name out of what GMod sends
function cleanName(text) {
  var q = /'([^']+)'/.exec(text) || /"([^"]+)"/.exec(text);
  if (q) { return q[1]; }
  var parts = String(text).split("/");
  return parts[parts.length - 1];
}

// ---------------------------------------------------------------- called by Garry's Mod
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
  gotGmod = true;
  if (servername) { setText("server", servername); }
  if (mapname) { setText("map", mapname); }
  if (gamemode) { setText("mode", gamemode); }
  if (maxplayers) { setText("slots", maxplayers); }
}

function SetFilesTotal(t) { gotGmod = true; total = parseInt(t, 10) || 0; render(); }
function SetFilesNeeded(n) { gotGmod = true; needed = parseInt(n, 10) || 0; render(); }

function DownloadingFile(fileName) {
  gotGmod = true;
  var name = cleanName(fileName);
  if (current && current !== name) { pushRecent(current); }
  current = name;
  setText("status", /workshop|addon/i.test(fileName) ? "Downloading workshop content" : "Downloading files");
  readProgress(fileName);
  render();
}

function SetStatusChanged(status) {
  gotGmod = true;
  var s = String(status || "");
  readProgress(s);
  if (/download/i.test(s) && /'|"/.test(s)) {           // "Downloading 'Addon name'": show it as the current item
    var name = cleanName(s);
    if (current && current !== name) { pushRecent(current); }
    current = name;
    setText("status", "Downloading workshop content");
  } else {
    setText("status", s.replace(/\.+$/, ""));
    if (/workshop complete/i.test(s)) { wsDone = wsTotal; }
    if (/mounting/i.test(s)) { current = "Mounting addons"; }
    if (/lua/i.test(s)) { current = "Loading scripts"; }
    if (/client info|sending/i.test(s)) { current = "Almost there"; }
  }
  render();
}

// ---------------------------------------------------------------- tips
var tipIndex = Math.floor(Math.random() * TIPS.length);
function nextTip() {
  var t = el("tiptext");
  t.style.opacity = 0;
  setTimeout(function () {
    tipIndex = (tipIndex + 1) % TIPS.length;
    t.textContent = TIPS[tipIndex];
    t.style.opacity = 1;
  }, 600);
}
setText("tiptext", TIPS[tipIndex]);
setInterval(nextTip, TIP_SECONDS * 1000);

// ---------------------------------------------------------------- opened in a normal browser: play a demo so you can see it
setTimeout(function () {
  if (gotGmod) { return; }
  GameDetails("Horizon DarkRP | Airdrops | Clans | Battle Pass", "", "rp_downtown_v4c_v2", 64, "", "DarkRP");
  var addons = ["Barqs Airdrops content", "DarkInv weapons pack", "Battle Pass wheels", "Dark Laundering content", "Horizon car pack", "Horizon player models", "Map content"];
  var i = 0;
  SetStatusChanged("Retrieving server info...");
  var demo = setInterval(function () {
    if (i < addons.length) {
      SetStatusChanged("Downloading '" + addons[i] + "' (" + (i + 1) + " of " + addons.length + ")");
      i++;
    } else if (i === addons.length) {
      SetStatusChanged("Workshop Complete"); i++;
      SetFilesTotal(40); SetFilesNeeded(40);
    } else if (needed > 0) {
      DownloadingFile("materials/horizon/hud_icon_" + needed + ".png");
      SetFilesNeeded(needed - 4);
    } else {
      SetStatusChanged("Sending client info...");
      clearInterval(demo);
    }
  }, 900);
}, 1500);

render();
</script>
